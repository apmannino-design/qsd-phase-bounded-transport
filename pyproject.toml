[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-qsd"
version = "0.1.0"
description = "QSD stabilization dynamics + Aurora principle AI for quantum computing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.13"]
cirq = ["cirq>=1.3"]
dev = ["pytest"]

[project.scripts]
aurora-qsd = "aurora_qsd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aurora_qsd*"]
